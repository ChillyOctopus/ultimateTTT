# Builds the engine for WebAssembly, tests it, then deploys web/dist to the Cloudflare Pages project "uttt"
# (uttt.jistevenson.com) on every push to main. Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with
# Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID, the same pair jistevenson.com's repo uses.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - run: python3 -m unittest -q test_ultimate_ttt
        working-directory: python
      - run: npm ci
        working-directory: web
      - run: node build.mjs
        working-directory: web
      - run: node test.mjs
        working-directory: web
      # The secrets reach only these two steps, never the installs or the build.
      - name: Create the Pages project on the first run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project list | grep -qw uttt || npx --yes wrangler@4 pages project create uttt --production-branch=main
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy web/dist --project-name=uttt --branch=main
