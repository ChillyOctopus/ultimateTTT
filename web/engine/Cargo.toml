# The engine for the web page: ultimattt's rules, minimax player and solver,
# built for WebAssembly by web/build.mjs.

[package]
name = "uttt-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
ultimattt = { path = "../../ultimattt" }
serde_json = "1.0.48"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
